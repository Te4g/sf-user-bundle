framework:
    mailer:
        message_bus: false
    cache:
        pools:
            cache.account_test_rate_limiter:
                adapter: cache.adapter.filesystem
    rate_limiter:
        account_login:
            cache_pool: cache.account_test_rate_limiter
        account_registration:
            cache_pool: cache.account_test_rate_limiter
        account_registration_ip:
            cache_pool: cache.account_test_rate_limiter
        account_magic_link:
            cache_pool: cache.account_test_rate_limiter
        account_password_reset:
            cache_pool: cache.account_test_rate_limiter
        account_verification_resend:
            cache_pool: cache.account_test_rate_limiter
        account_email_change:
            cache_pool: cache.account_test_rate_limiter

services:
    App\Tests\Functional\ObservableTestLogger:
        public: true
    logger:
        alias: App\Tests\Functional\ObservableTestLogger
        public: true
    monolog.logger.request:
        alias: App\Tests\Functional\ObservableTestLogger
        public: true
    monolog.logger.security:
        alias: App\Tests\Functional\ObservableTestLogger
        public: true
    App\Tests\Functional\ObservableRequestTestLogger:
        class: App\Tests\Functional\ObservableTestLogger
        decorates: monolog.logger.request
        decoration_on_invalid: ignore
        public: true
    App\Tests\Functional\ObservableSecurityTestLogger:
        class: App\Tests\Functional\ObservableTestLogger
        decorates: monolog.logger.security
        decoration_on_invalid: ignore
        public: true
