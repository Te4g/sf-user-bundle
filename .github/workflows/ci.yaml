name: CI

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    php:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php-version:
                    - '8.4'
                    - '8.5'
        steps:
            -   uses: actions/checkout@v4
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}
                    tools: composer
            -   run: composer install --prefer-dist --no-progress
            -   run: make test
